name: Release

# A version tag (v0.5.0) becomes a draft release carrying the installers,
# their update signatures and latest.json, which the installed app updates
# from (src-tauri/src/updater.rs). It goes public when the maintainer
# publishes the draft, so nothing half-uploaded is ever offered to an
# installed copy, and no push to main releases anything. Only the owner can
# push tags, so nothing from a fork reaches this workflow: there is
# deliberately no pull_request trigger here, and never a pull_request_target.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # open the draft release and upload the bundles to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            streamdeck/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix streamdeck
          rustup target add ${{ matrix.target }}

      # The tag is the version. One that does not match the app stops here
      # rather than shipping a bundle that calls itself something else.
      - name: Check the tag against tauri.conf.json
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME, but tauri.conf.json says $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # the packed Stream Deck plugin ships inside the app as a resource
      - name: Pack the Stream Deck plugin
        run: npm run streamdeck:pack

      # Builds, signs each bundle with the updater key, uploads to a draft
      # release under the tag (opening it if this job is first), and merges
      # this platform's entry into the release's latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LLM Speedometer __VERSION__'
          releaseBody: 'See the notes above the assets.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
