[package]
name = "llm-speedometer"
version = "0.4.0"
description = "A desktop gauge cluster for LLM coding CLIs"
authors = ["William Fan"]
license = "MIT"
repository = "https://github.com/WestphalianFresco/llm-speedometer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "llm_speedometer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
