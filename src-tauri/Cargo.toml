[package]
name = "llm-speedometer"
version = "0.5.0"
description = "A desktop gauge cluster for LLM coding CLIs"
authors = ["William Fan"]
license = "MIT"
repository = "https://github.com/WestphalianFresco/llm-speedometer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "llm_speedometer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
